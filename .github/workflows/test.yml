name: Test
on:
  push:
    branches: [ '*' ]

jobs:
  golangci:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11

      - name: Run program
        env:
          R3CSR45CROSS2020: ${{ secrets.R3CSR45CROSS2020 }}
        run: go run .