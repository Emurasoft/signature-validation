name: Validate signature

on:
  schedule:
    # Offset to avoid peak times
    - cron: '58 */2 * * *'
  push:
    branches: [ 'ci' ]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download artifact from latest main
        uses: dawidd6/action-download-artifact@v21
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          branch: main
          name: signature-validation-linux
          check_artifacts: true
          search_artifacts: true

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/ms-playwright-go
          key: playwright-linux-v0.5700.1

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: go run github.com/playwright-community/playwright-go/cmd/playwright@v0.5700.1 install --with-deps --only-shell chromium

      - name: Run validation
        id: run_validation
        continue-on-error: true
        env:
          R3CSR45CROSS2020: ${{ secrets.R3CSR45CROSS2020 }}
        run: |
          set -o pipefail
          chmod +x ./signature-validation
          ./signature-validation | tee status.json

      - name: Parse validation result
        id: parse_result
        run: |
          {
            echo "error_occurred=$(jq -r 'if .error then "True" else "False" end' status.json)"
            echo "validation_failed=$(jq -r 'if .result.valid == false then "True" else "False" end' status.json)"
            echo "validation_reason=$(jq -r '.error // .result.reason // ""' status.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Update status.json in validation-results
        id: update_status
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const branch = 'validation-results';
            const path = 'status.json';

            const content = fs.readFileSync('status.json', 'utf8');
            const encoded = Buffer.from(content, 'utf8').toString('base64');

            let sha;
            try {
              const { data: file } = await github.rest.repos.getContent({
                owner,
                repo,
                path,
                ref: branch,
              });
              if (!Array.isArray(file)) {
                sha = file.sha;
              }
            } catch (error) {
              core.info('status.json or branch does not exist yet; will create it.');
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              message: 'Set validation result',
              content: encoded,
              branch,
              sha,
            });

      - name: Create issue on failed validation
        if: ${{ steps.parse_result.outputs.error_occurred == 'True' || steps.parse_result.outputs.validation_failed == 'True' }}
        uses: actions/github-script@v9
        env:
          VALIDATION_REASON:   ${{ steps.parse_result.outputs.validation_reason }}
          ERROR_OCCURRED:      ${{ steps.parse_result.outputs.error_occurred }}
          VALIDATION_FAILED:   ${{ steps.parse_result.outputs.validation_failed }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;

            // Check for existing issue
            const q = `repo:${owner}/${repo} "signature validation" in:title is:issue is:open`;
            const { data: search } = await github.rest.search.issuesAndPullRequests({ q });

            if (search.total_count > 0) {
              core.info('An open "signature validation" issue already exists. Skipping issue creation.');
              return;
            }

            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const reason = process.env.VALIDATION_REASON || 'Unknown reason';
            const errorOccurred = process.env.ERROR_OCCURRED === 'True';
            const validationFailed = process.env.VALIDATION_FAILED === 'True';

            let body;
            if (errorOccurred) {
              body =
                `@MakotoE, an error occurred while running signature validation.\n` +
                `Error: ${reason}\n` +
                `Run: ${runUrl}`;
            } else if (validationFailed) {
              body =
                `@MakotoE, signature validation failed.\n` +
                `Reason: ${reason}\n` +
                `Run: ${runUrl}`;
            } else {
              body =
                `@MakotoE, there was an issue with the workflow run.\n` +
                `Details: ${reason}\n` +
                `Run: ${runUrl}`;
            }

            await github.rest.issues.create({
              owner,
              repo,
              title: '⚠️ Signature validation failed',
              body,
            });
