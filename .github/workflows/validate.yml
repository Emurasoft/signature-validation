name: Validate signature

on:
  schedule:
    # Offset to avoid peak times
    - cron: '58 */2 * * *'
  push:
    branches: [ 'ci' ]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download artifact from latest main
        uses: dawidd6/action-download-artifact@v21
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          branch: main
          name: signature-validation-linux
          check_artifacts: true
          search_artifacts: true

      - name: Run validation
        id: run_validation
        continue-on-error: true
        env:
          R3CSR45CROSS2020: ${{ secrets.R3CSR45CROSS2020 }}
        run: |
          set -o pipefail
          chmod +x ./signature-validation
          ./signature-validation | tee status.json

      - name: Update status.json in validation-results
        id: update_status
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const branch = 'validation-results';
            const path = 'status.json';

            const content = fs.readFileSync('status.json', 'utf8');
            const encoded = Buffer.from(content, 'utf8').toString('base64');

            let sha;
            try {
              const { data: file } = await github.rest.repos.getContent({
                owner,
                repo,
                path,
                ref: branch,
              });
              if (!Array.isArray(file)) {
                sha = file.sha;
              }
            } catch (error) {
              core.info('status.json or branch does not exist yet; will create it.');
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              message: 'Set validation result',
              content: encoded,
              branch,
              sha,
            });

      - name: Create issue on failed validation
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;

            // Read and parse the validation result
            const status = JSON.parse(fs.readFileSync('status.json', 'utf8'));
            const errorOccurred = status.error && status.error !== '';
            const validationFailed = !errorOccurred && (
              (status.installer_result && status.installer_result.valid === false) ||
              (status.portable_result && status.portable_result.valid === false)
            );

            // No issue needed if everything is fine
            if (!errorOccurred && !validationFailed) {
              core.info('Validation passed. No issue needed.');
              return;
            }

            // Check for existing issue
            const q = `repo:${owner}/${repo} "signature validation" in:title is:issue is:open`;
            const { data: search } = await github.rest.search.issuesAndPullRequests({ q });

            if (search.total_count > 0) {
              core.info('An open "signature validation" issue already exists. Skipping issue creation.');
              return;
            }

            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            let reason, body;
            if (errorOccurred) {
              reason = status.error;
              body =
                `@MakotoE, an error occurred while running signature validation.\n` +
                `Error: ${reason}\n` +
                `Run: ${runUrl}`;
            } else {
              const reasons = [];
              if (status.installer_result?.valid === false) {
                reasons.push(status.installer_result.reason || 'unknown installer failure');
              }
              if (status.portable_result?.valid === false) {
                reasons.push(status.portable_result.reason || 'unknown portable failure');
              }
              reason = reasons.join('; ') || 'Unknown reason';
              body =
                `@MakotoE, signature validation failed.\n` +
                `Reason: ${reason}\n` +
                `Run: ${runUrl}`;
            }

            await github.rest.issues.create({
              owner,
              repo,
              title: '⚠️ Signature validation failed',
              body,
            });
