name: Build

on:
  push:
    branches: [ 'main' ]

jobs:
  build:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Build
        run: go build -v -o signature-validation .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: signature-validation-linux
          path: signature-validation
